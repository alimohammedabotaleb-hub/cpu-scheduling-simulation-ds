name: Validate Windows desktop GUI

on:
  push:
    branches: [main]
    paths: ['src/**', '.github/workflows/gui-validation.yml', 'scripts/test_windows_gui.ps1']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build independent Windows executable with MSVC
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'The hosted Windows runner has no MSVC C++ toolchain.' }
          $devCommand = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
          $buildScript = Join-Path $env:RUNNER_TEMP 'build_cpu_gui.cmd'
          @(
            '@echo off',
            ('call "' + $devCommand + '" -no_logo -arch=x64'),
            'if errorlevel 1 exit /b %errorlevel%',
            'cl /nologo /std:c++17 /EHsc /W4 /MT /utf-8 src\CPU_Scheduling_Simulator.cpp /Fe:artifacts\CPU_Scheduling_Simulator.exe /Fo:artifacts\CPU_Scheduling_Simulator.obj /link user32.lib gdi32.lib',
            'exit /b %errorlevel%'
          ) | Set-Content -Encoding ASCII -LiteralPath $buildScript
          & $env:ComSpec /d /c $buildScript
          if ($LASTEXITCODE -ne 0) { throw "MSVC build failed with exit code $LASTEXITCODE" }
          Remove-Item artifacts\CPU_Scheduling_Simulator.obj -ErrorAction SilentlyContinue

      - name: Check console results and exercise desktop controls
        run: |
          & .\scripts\test_windows_gui.ps1 -Executable .\artifacts\CPU_Scheduling_Simulator.exe -OutputDirectory .\artifacts

      - name: Publish desktop verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: CPU-Scheduling-Windows-GUI-Validation
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

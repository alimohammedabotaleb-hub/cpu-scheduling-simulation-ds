name: Verify console Windows program
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/verify-windows.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check that the program is console only
        shell: pwsh
        run: |
          $Source = Get-Content src/CPU_Scheduling_Simulator.cpp -Raw
          if ($Source -match '(?i)windows\.h|\b(HWND|HFONT|WPARAM|LPARAM|LRESULT|WinMain)\b|\b(CreateWindow\w*|ShowWindow|MessageBox\w*|GetMessage\w*|DispatchMessage\w*|SetDlgItemText\w*)\b') {
            throw 'The source still contains Windows graphical interface code.'
          }
          foreach ($File in @('CMakeLists.txt', 'build_windows.bat')) {
            if ((Get-Content $File -Raw) -match '(?i)user32|gdi32|/SUBSYSTEM:WINDOWS|\-mwindows') {
              throw "The build file still contains a graphical interface dependency: $File"
            }
          }
      - name: Build Windows console executable
        shell: pwsh
        run: |
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VisualStudio = & $VsWhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $VisualStudio) { throw 'The Visual C++ build tools were not found.' }
          $DeveloperCommand = Join-Path $VisualStudio 'Common7\Tools\VsDevCmd.bat'
          New-Item -ItemType Directory -Force build | Out-Null
          $BuildCommand = 'call "' + $DeveloperCommand + '" -arch=x64 -host_arch=x64 && cl /nologo /std:c++17 /EHsc /W4 /WX /utf-8 /O2 /MT src\CPU_Scheduling_Simulator.cpp /Fe:build\CPU_Scheduling_Simulator.exe /Fo:build\'
          & cmd.exe /d /c $BuildCommand
          if ($LASTEXITCODE -ne 0) { throw "MSVC build failed with exit code $LASTEXITCODE." }
      - name: Verify both built-in samples and all algorithms
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $Assignment = (& .\build\CPU_Scheduling_Simulator.exe | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'Default execution failed.' }
          $Comparison = (& .\build\CPU_Scheduling_Simulator.exe --compare | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'Comparison execution failed.' }
          $Assignment | Set-Content artifacts/assignment-console.txt
          $Comparison | Set-Content artifacts/comparison-console.txt
          $Cases = @(
            @{ Name='assignment'; Text=$Assignment; WT=@('3.33','3.33','3.33','6.00'); TAT=@('8.67','8.67','8.67','11.33'); CPU='100.00'; PIDs=3 },
            @{ Name='comparison'; Text=$Comparison; WT=@('6.80','5.00','5.20','8.40'); TAT=@('11.20','9.40','9.60','12.80'); CPU='91.67'; PIDs=5 }
          )
          $Names = @('FCFS', 'SJF', 'Priority', 'Round Robin')
          foreach ($Case in $Cases) {
            foreach ($Header in @('PID\s+AT\s+BT\s+PRI\s+CT\s+WT\s+TAT', 'Execution order / Gantt intervals:', 'Reverse history \(Stack\):')) {
              if ([regex]::Matches($Case.Text, $Header).Count -ne 4) { throw "$($Case.Name): missing per-algorithm output: $Header" }
            }
            for ($Index=0; $Index -lt 4; ++$Index) {
              $Row = '(?m)^' + [regex]::Escape($Names[$Index]) + '\s+' + [regex]::Escape($Case.WT[$Index]) + '\s+' + [regex]::Escape($Case.TAT[$Index]) + '\s+' + [regex]::Escape($Case.CPU) + '\s*$'
              if ($Case.Text -notmatch $Row) { throw "$($Case.Name): incorrect averages or CPU utilization for $($Names[$Index])" }
            }
            for ($ID=1; $ID -le $Case.PIDs; ++$ID) {
              $Row = '(?m)^P' + $ID + '\s+\d+\s+\d+\s+\d+\s+\d+\s+\d+\s+\d+\s*$'
              if ([regex]::Matches($Case.Text, $Row).Count -ne 4) { throw "$($Case.Name): missing metrics for P$ID" }
            }
            if ($Case.Text -notmatch 'P1\[\d+,\d+\)') { throw "$($Case.Name): execution intervals were not printed." }
          }
          if ($Comparison -notmatch 'IDLE\[0,2\)') { throw 'Initial idle time was not included in the comparison sample.' }
          'PASS: Windows console build, all four algorithms, both built-in samples, metrics, execution intervals, Stack history, and absence of GUI dependencies.' | Tee-Object artifacts/verification-result.txt
      - name: Keep verified program and output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: console-windows-verification
          path: |
            build/CPU_Scheduling_Simulator.exe
            artifacts/
          retention-days: 7

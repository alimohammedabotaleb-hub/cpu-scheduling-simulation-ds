name: Run CPU Scheduling Project

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-run:
    name: Build and run on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - name: Get source and build files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure C++17 build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build the simulator
        run: cmake --build build --config Release --parallel 2

      - name: Execute and check both samples
        run: |
          mkdir -p artifacts
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            simulator="build/Release/CPU_Scheduling_Simulator.exe"
          else
            simulator="build/CPU_Scheduling_Simulator"
          fi
          "$simulator" | tee artifacts/Assignment_Output.txt
          "$simulator" --compare | tee artifacts/Comparison_Output.txt
          python - <<'PY'
          from pathlib import Path
          import re

          expected = {
              "Assignment": ([3.33, 3.33, 3.33, 6.00], [8.67, 8.67, 8.67, 11.33], 100.00),
              "Comparison": ([6.80, 5.00, 5.20, 8.40], [11.20, 9.40, 9.60, 12.80], 91.67),
          }
          for name, (waiting, turnaround, utilization) in expected.items():
              text = Path(f"artifacts/{name}_Output.txt").read_text(encoding="utf-8")
              actual_waiting = [float(x) for x in re.findall(r"Average Waiting Time\s*:\s*([\d.]+)", text)]
              actual_turnaround = [float(x) for x in re.findall(r"Average Turnaround Time\s*:\s*([\d.]+)", text)]
              actual_utilization = [float(x) for x in re.findall(r"CPU Utilization\s*:\s*([\d.]+)%", text)]
              assert actual_waiting == waiting, (name, "Waiting", actual_waiting)
              assert actual_turnaround == turnaround, (name, "Turnaround", actual_turnaround)
              assert actual_utilization == [utilization] * 4, (name, "Utilization", actual_utilization)
              assert text.count("Execution order:") == 4, name
              assert text.count("Stack history (latest first):") == 4, name
              print(f"{name} sample passed all output checks.")
          PY
          cp "$simulator" artifacts/
          {
            printf '## CPU Scheduling Algorithms Simulation Using Data Structures\n\n'
            printf 'C++17 build and both samples passed on %s.\n\n' "$RUNNER_OS"
            for sample in Assignment Comparison; do
              printf '<details open><summary>%s sample results</summary>\n\n' "$sample"
              printf '```text\n'
              cat "artifacts/${sample}_Output.txt"
              printf '\n```\n</details>\n\n'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download executable and run results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CPU-Scheduling-${{ runner.os }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
